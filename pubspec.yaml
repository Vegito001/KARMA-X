name: karmax
description: KarmaX - AI-powered life simulation RPG engine.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  animate_do: ^5.1.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  http: ^1.2.1
  model_viewer_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/.env.local
    - assets/models/

  